[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "microduck-harness"
version = "0.3.0"
description = "Bounded Microduck autonomy with nanoMuse MCP, AgentJev and a private GLM endpoint"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "pydantic>=2.8,<3", "mcp>=1.28,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
vision = ["numpy>=1.26,<3", "opencv-contrib-python-headless>=4.10,<5"]
print = ["reportlab>=4,<6", "pypdf>=5,<7", "Pillow>=10,<13"]
yolo = ["ultralytics>=8.3,<9"]

[project.scripts]
duck-harness = "microduck_harness.cli:main"
duck-deploy = "microduck_harness.deployment:main"

[tool.setuptools.packages.find]
include = ["microduck_harness*"]

[tool.setuptools.package-data]
microduck_harness = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

